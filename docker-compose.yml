services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: piscina-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=*
      - TZ=America/La_Paz
    networks:
      - piscina-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: piscina-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - piscina-net

networks:
  piscina-net:
    driver: bridge
